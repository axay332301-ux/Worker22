<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secured API HLS Player</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#070a10;color:#fff;font-family:Arial,sans-serif}
.wrap{max-width:960px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-size:20px;font-weight:800}.status{font-size:12px;color:#93a0b3}
.card{background:#101620;border:1px solid #273142;border-radius:16px;padding:12px}
.form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px;}
.form input[type="text"]{flex:1;min-width:0;background:#080d14;color:#fff;border:1px solid #303b4d;border-radius:10px;padding:14px;outline:0}
button,select{background:#192332;color:#fff;border:1px solid #303b4d;border-radius:9px;padding:10px 12px;cursor:pointer}
.primary{background:#4777ff;border:0;font-weight:700}.screen{margin-top:12px;background:#000;border-radius:14px;overflow:hidden}
video{display:block;width:100%;background:#000;max-height:70vh}.controls{padding:9px;background:#0b1017}
.seek{width:100%;accent-color:#4777ff}.buttons{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:7px}.grow{flex:1}
.time{font-size:12px;color:#c6ccd6}.msg{font-size:12px;color:#98a4b6;margin-top:10px;line-height:1.5;word-break:break-all}
.progressBox{display:none;margin-top:10px}.progressBox.show{display:block}.bar{height:8px;background:#202a38;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#4777ff;transition: width 0.2s ease;}
.proxy-toggle{display:flex;align-items:center;gap:5px;font-size:13px;color:#c6ccd6;cursor:pointer;}
@media(max-width:600px){.form{flex-direction:column;align-items:stretch}.form button{width:100%}.logo{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><div class="logo">▶ Secured API Player</div><div id="status" class="status">Ready</div></div>
<div class="card">
<div class="form">
<input id="url" type="text" placeholder="https://rozgarapinew.teachx.in/... .m3u8 URL डालें">
<label class="proxy-toggle"><input type="checkbox" id="useProxy" checked> Proxy</label>
<button id="load" class="primary">PLAY</button>
</div>

<div class="screen">
<video id="video" playsinline preload="metadata"></video>
<div class="controls">
<input id="seek" class="seek" type="range" min="0" max="1000" value="0">
<div class="buttons">
<button id="back">↶ 10s</button><button id="toggle">▶</button><button id="next">10s ↷</button>
<button id="mute">🔊</button><span id="time" class="time">00:00 / 00:00</span><span class="grow"></span>
<select id="speed"><option>.5</option><option>.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option><option>3</option><option>4</option></select>
<button id="pip">PiP</button><button id="download">⬇ Download</button><button id="fs">⛶</button>
</div>
</div>
</div>

<div id="msg" class="msg">सिर्फ rozgarapinew.teachx.in के लिंक्स ही सपोर्टेड हैं।</div>
<div id="downloadBox" class="progressBox">
<div id="downloadText" class="msg">Preparing…</div>
<div class="bar"><i id="bar"></i></div>
</div>
</div></div>

<script>
const WORKER_BASE = "https://proplayer.probrosystemset.workers.dev";
const PROXY = WORKER_BASE + "/proxy?url=";
const SEGMENT = WORKER_BASE + "/segment?url=";

// 1. Domain Restriction Lock (सिर्फ यही API चलेगी)
const ALLOWED_API = "https://rozgarapinew.teachx.in";

// 2. Hardcoded Secure Headers
const customHeaders = {
    "Origin": "https://appx-play.akamai.net.in",
    "sec-ch-ua": '"Chromium";v="154", "Android WebView";v="154", "Not A(Brand";v="99"',
    "sec-ch-ua-mobile": "?1",
    "Accept": "*/*",
    "sec-ch-ua-platform": '"Android"',
    "User-Agent": "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Mobile Safari/537.36",
    "Referer": "https://appx-play.akamai.net.in/"
};

const v = document.getElementById("video"), input = document.getElementById("url");
const msg = document.getElementById("msg"), status = document.getElementById("status");
const useProxyCheckbox = document.getElementById("useProxy");
let hls = null;

function say(t, e=false){ msg.textContent = t; msg.style.color = e ? "#ff9696" : "#98a4b6"; }

// URL Validation Function (अब यह API को भी चेक करेगा)
function valid(u) {
  try {
    const urlObj = new URL(u);
    if (!["http:", "https:"].includes(urlObj.protocol)) return false;
    // अगर URL ALLOWED_API से शुरू नहीं होता है, तो false रिटर्न करे
    if (!urlObj.href.startsWith(ALLOWED_API)) return false;
    return true;
  } catch {
    return false;
  }
}

function manifest(u) {
  if (!useProxyCheckbox.checked) return u;
  try {
    const x = new URL(u);
    if (x.hostname.includes("workers.dev")) return u;
    return PROXY + encodeURIComponent(u);
  } catch { return u; }
}

function segment(u) {
  if (!useProxyCheckbox.checked) return false;
  return /\.(ts|m4s|mp4|aac|mp3|vtt|webvtt|key)(\?|$)/i.test(u.split("?")[0]);
}

class BackendLoader extends Hls.DefaultConfig.loader {
  load(ctx, cfg, cb) {
    if (segment(ctx.url) && !ctx.url.includes("workers.dev")) {
      ctx.url = SEGMENT + encodeURIComponent(ctx.url);
    }
    super.load(ctx, cfg, cb);
  }
}

function stop(){
  if(hls){ try{ hls.destroy(); } catch{} hls = null; }
  v.pause(); v.removeAttribute("src"); v.load();
}

function start() {
  let raw = input.value.trim();
  if(!valid(raw)){ 
    say("❌ Invalid URL! यह प्लेयर सिर्फ 'https://rozgarapinew.teachx.in' के लिंक्स प्ले कर सकता है।", true); 
    return; 
  }
  
  stop();
  let src = manifest(raw);
  status.textContent = "Loading…";
  say(`Loading secured stream...`);

  if (Hls.isSupported()) {
    hls = new Hls({
      enableWorker: true,
      lowLatencyMode: false,
      backBufferLength: 30,
      maxBufferLength: 20,
      loader: useProxyCheckbox.checked ? BackendLoader : Hls.DefaultConfig.loader,
      // Injecting Hardcoded Headers
      xhrSetup: function(xhr, url) {
        for (const [key, value] of Object.entries(customHeaders)) {
          if (value !== "") {
            xhr.setRequestHeader(key, value);
          }
        }
      }
    });
    
    hls.on(Hls.Events.MEDIA_ATTACHED, () => { hls.loadSource(src); });
    hls.on(Hls.Events.MANIFEST_PARSED, () => {
      status.textContent = "Ready"; say("Stream ready."); v.play().catch(()=>{});
    });
    
    hls.on(Hls.Events.ERROR, (event, data) => {
      if (data.fatal) {
        if(data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            status.textContent = "Network Error";
            say("Network/Header Error! सर्वर रिजेक्ट कर रहा है। Proxy चेक करें।", true);
            hls.destroy();
        } else if(data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
        }
      }
    });
    hls.attachMedia(v);
  } 
  else {
    say("इस browser में HLS supported नहीं है।", true);
  }
}

async function downloadMerged(){
 const raw=input.value.trim();
 if(!valid(raw)){ 
   say("❌ Invalid URL! सिर्फ 'https://rozgarapinew.teachx.in' के लिंक्स अलाउड हैं।", true); 
   return; 
 }
 if(!hls || !hls.levels || hls.levels.length === 0 || !hls.levels[hls.currentLevel >= 0 ? hls.currentLevel : 0]?.details) {
     say("⚠️ कृपया पहले 'PLAY' बटन दबाएं और वीडियो चलने दें।", true);
     return;
 }

 const box=document.getElementById("downloadBox"), text=document.getElementById("downloadText"), bar=document.getElementById("bar");
 box.classList.add("show"); bar.style.width="2%"; status.textContent="Downloading…";

 // Headers for Downloader
 let fetchOpts = { headers: {} };
 for (const [key, value] of Object.entries(customHeaders)) {
    if (value !== "") fetchOpts.headers[key] = value;
 }

 try{
  let levelIndex = Math.max(0, hls.currentLevel);
  let level = hls.levels[levelIndex];
  let fragments = level.details.fragments;
  if(!fragments || fragments.length === 0) throw new Error("इस वीडियो में कोई segments नहीं मिले!");

  let downloadedBuffers = [];
  let total = fragments.length;

  if (fragments[0].initSegment) {
      text.textContent = "Downloading Init Segment...";
      let initUrl = fragments[0].initSegment.url;
      if(useProxyCheckbox.checked && !initUrl.includes("workers.dev")) initUrl = SEGMENT + encodeURIComponent(initUrl);
      let res = await fetch(initUrl, fetchOpts);
      if(!res.ok) throw new Error("Init Segment HTTP " + res.status);
      downloadedBuffers.push(await res.arrayBuffer());
  }

  for(let i=0; i<total; i++){
      text.textContent=`Downloading segment: ${i+1} / ${total}`;
      let segUrl = fragments[i].url; 
      if(useProxyCheckbox.checked && !segUrl.includes("workers.dev")) segUrl = SEGMENT + encodeURIComponent(segUrl);
      let segRes = await fetch(segUrl, fetchOpts);
      if(!segRes.ok) throw new Error(`Segment ${i+1} Error ${segRes.status}`);
      downloadedBuffers.push(await segRes.arrayBuffer());
      bar.style.width = Math.round(((i + 1) / total) * 100) + "%";
  }

  text.textContent="Merging segments…";
  const blob = new Blob(downloadedBuffers, {type: "video/mp4"});
  const finalUrl = URL.createObjectURL(blob);
  
  const a = document.createElement("a"); a.href = finalUrl; a.download = `Video_${Date.now()}.mp4`;
  document.body.appendChild(a); a.click(); a.remove();
  
  setTimeout(()=> URL.revokeObjectURL(finalUrl), 60000);
  bar.style.width="100%"; text.textContent="Download पूरा हुआ!"; status.textContent="Ready";
  say("Video सफलतापूर्वक download हो गई है।");

 }catch(e){
  bar.style.width="0"; status.textContent="Download error";
  say("Download failed: "+e.message, true);
 }
}

function fmt(x){if(!Number.isFinite(x))return"00:00";x=Math.floor(x);let h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return h?`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`}
document.getElementById("load").onclick=start;input.onkeydown=e=>{if(e.key==="Enter")start()};
document.getElementById("toggle").onclick=()=>v.paused?v.play():v.pause();
v.onplay=()=>document.getElementById("toggle").textContent="⏸";v.onpause=()=>document.getElementById("toggle").textContent="▶";
document.getElementById("back").onclick=()=>v.currentTime=Math.max(0,v.currentTime-10);
document.getElementById("next").onclick=()=>v.currentTime=Math.min(v.duration||Infinity,v.currentTime+10);
document.getElementById("mute").onclick=()=>{v.muted=!v.muted;document.getElementById("mute").textContent=v.muted?"🔇":"🔊"};
document.getElementById("speed").onchange=e=>v.playbackRate=+e.target.value;
document.getElementById("download").onclick=downloadMerged;
document.getElementById("pip").onclick=async()=>{try{if(document.pictureInPictureElement)await document.exitPictureInPicture();else await v.requestPictureInPicture()}catch{}};
document.getElementById("fs").onclick=async()=>{try{if(!document.fullscreenElement)await document.querySelector(".screen").requestFullscreen();else await document.exitFullscreen()}catch{}};
v.ontimeupdate=()=>{let d=v.duration;if(Number.isFinite(d)&&d>0)document.getElementById("seek").value=v.currentTime/d*1000;document.getElementById("time").textContent=fmt(v.currentTime)+" / "+fmt(d)};
document.getElementById("seek").oninput=e=>{if(Number.isFinite(v.duration))v.currentTime=e.target.value/1000*v.duration};
v.onwaiting=()=>status.textContent="Buffering…";v.onplaying=()=>status.textContent="Playing";v.onended=()=>status.textContent="Ended";
</script>
</body>
</html>
